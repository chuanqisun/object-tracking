<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LiteRT.js YOLO Detection POC</title>
    <style>
      body {
        font-family: monospace, sans-serif;
        padding: 16px;
      }
      .control-row {
        margin-bottom: 8px;
      }
      label {
        font-weight: bold;
      }
      input,
      select,
      button {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <h2>LiteRT.js Webcam YOLO Detection POC</h2>

    <div class="control-row">
      <label for="modelFileInput">Upload Model (.tflite): </label>
      <input type="file" id="modelFileInput" accept=".tflite" />
    </div>

    <div class="control-row">
      <label for="imgWidthInput">Model Input Size: </label>
      <input type="number" id="imgWidthInput" value="640" min="32" max="4096" step="32" style="width: 60px" /> x
      <input type="number" id="imgHeightInput" value="640" min="32" max="4096" step="32" style="width: 60px" />
      |
      <label for="confThreshInput">Conf: </label>
      <input type="number" id="confThreshInput" value="0.25" min="0.01" max="1.0" step="0.05" style="width: 55px" />
      <label for="iouThreshInput">IoU: </label>
      <input type="number" id="iouThreshInput" value="0.45" min="0.01" max="1.0" step="0.05" style="width: 55px" />
    </div>

    <div class="control-row">
      <label for="acceleratorSelect">Accelerator: </label>
      <select id="acceleratorSelect">
        <option value="auto" selected>Auto (WebGPU with CPU/WASM Fallback)</option>
        <option value="webgpu">WebGPU</option>
        <option value="wasm">WASM (CPU / XNNPACK)</option>
      </select>
    </div>

    <div class="control-row">
      <label for="cameraSelect">Camera: </label>
      <select id="cameraSelect">
        <option value="">Default / Auto</option>
      </select>
      <button id="scanBtn">Scan Cameras</button>
      <button id="startBtn" disabled>Start Camera</button>
      <button id="stopBtn" disabled>Stop Camera</button>
    </div>

    <div class="control-row" style="margin-top: 10px">
      <strong>Backend:</strong> <span id="backendBadge">None</span> | <strong>Status:</strong> <span id="status">Loading LiteRT runtime...</span> |
      <strong>FPS:</strong> <span id="fps">0</span> | <strong>Detections:</strong> <span id="detCount">0</span>
    </div>

    <div style="position: relative; margin-top: 10px">
      <!-- Hidden source video stream -->
      <video id="webcam" playsinline style="display: none"></video>
      <!-- Display canvas for input frame and detection tracking overlay -->
      <canvas id="outputCanvas" width="640" height="640" style="border: 1px solid #333; max-width: 100%; height: auto"></canvas>
    </div>

    <!-- Offscreen canvas for frame resizing & normalization -->
    <canvas id="processCanvas" width="640" height="640" style="display: none"></canvas>

    <script type="module">
      import { loadLiteRt, loadAndCompile, Tensor } from "https://cdn.jsdelivr.net/npm/@litertjs/core@latest/+esm";

      const COCO_CLASSES = [
        "person",
        "bicycle",
        "car",
        "motorcycle",
        "airplane",
        "bus",
        "train",
        "truck",
        "boat",
        "traffic light",
        "fire hydrant",
        "stop sign",
        "parking meter",
        "bench",
        "bird",
        "cat",
        "dog",
        "horse",
        "sheep",
        "cow",
        "elephant",
        "bear",
        "zebra",
        "giraffe",
        "backpack",
        "umbrella",
        "handbag",
        "tie",
        "suitcase",
        "frisbee",
        "skis",
        "snowboard",
        "sports ball",
        "kite",
        "baseball bat",
        "baseball glove",
        "skateboard",
        "surfboard",
        "tennis racket",
        "bottle",
        "wine glass",
        "cup",
        "fork",
        "knife",
        "spoon",
        "bowl",
        "banana",
        "apple",
        "sandwich",
        "orange",
        "broccoli",
        "carrot",
        "hot dog",
        "pizza",
        "donut",
        "cake",
        "chair",
        "couch",
        "potted plant",
        "bed",
        "dining table",
        "toilet",
        "tv",
        "laptop",
        "mouse",
        "remote",
        "keyboard",
        "cell phone",
        "microwave",
        "oven",
        "toaster",
        "sink",
        "refrigerator",
        "book",
        "clock",
        "vase",
        "scissors",
        "teddy bear",
        "hair drier",
        "toothbrush",
      ];

      const COLORS = [
        "#00FF00",
        "#FF3838",
        "#FF9D97",
        "#FF701F",
        "#FFB21D",
        "#CFD231",
        "#48F90A",
        "#92CC17",
        "#3DDB86",
        "#1A9334",
        "#00D4BB",
        "#2C99A8",
        "#00C2FF",
        "#344593",
        "#6473FF",
        "#0018EC",
        "#8438FF",
        "#520085",
        "#CB38FF",
        "#FF95C8",
        "#FF37C7",
      ];

      let model = null;
      let stream = null;
      let isRunning = false;
      let frameCount = 0;
      let fpsTimer = performance.now();
      let runtimeReady = false;
      let cachedModelBuffer = null;

      const video = document.getElementById("webcam");
      const canvas = document.getElementById("outputCanvas");
      const ctx = canvas.getContext("2d");
      const processCanvas = document.getElementById("processCanvas");
      const processCtx = processCanvas.getContext("2d", { willReadFrequently: true });
      const statusEl = document.getElementById("status");
      const fpsEl = document.getElementById("fps");
      const detCountEl = document.getElementById("detCount");
      const backendBadge = document.getElementById("backendBadge");
      const cameraSelect = document.getElementById("cameraSelect");
      const acceleratorSelect = document.getElementById("acceleratorSelect");
      const modelFileInput = document.getElementById("modelFileInput");
      const imgWidthInput = document.getElementById("imgWidthInput");
      const imgHeightInput = document.getElementById("imgHeightInput");
      const confThreshInput = document.getElementById("confThreshInput");
      const iouThreshInput = document.getElementById("iouThreshInput");
      const scanBtn = document.getElementById("scanBtn");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");

      function getInputDimensions() {
        const w = parseInt(imgWidthInput.value, 10) || 640;
        const h = parseInt(imgHeightInput.value, 10) || 640;
        return { width: w, height: h };
      }

      function updateCanvasDimensions() {
        const { width, height } = getInputDimensions();
        canvas.width = width;
        canvas.height = height;
        processCanvas.width = width;
        processCanvas.height = height;
      }

      imgWidthInput.addEventListener("change", updateCanvasDimensions);
      imgHeightInput.addEventListener("change", updateCanvasDimensions);

      // Inspect model input tensor shape and update UI/canvas automatically
      function syncDimensionsFromModel(compiledModel) {
        try {
          if (typeof compiledModel.getInputDetails === "function") {
            const inputs = compiledModel.getInputDetails();
            if (inputs && inputs.length > 0 && inputs[0].shape) {
              const shape = inputs[0].shape;
              let h, w;
              if (shape.length === 4) {
                // NCHW: [1, 3, H, W]
                if (shape[1] === 3 || shape[1] === 1) {
                  h = shape[2];
                  w = shape[3];
                } else {
                  // NHWC: [1, H, W, 3]
                  h = shape[1];
                  w = shape[2];
                }
              }
              if (h && w) {
                imgWidthInput.value = w;
                imgHeightInput.value = h;
                updateCanvasDimensions();
                console.log(`Auto-configured model input dimensions: ${w}x${h}`);
              }
            }
          }
        } catch (e) {
          console.warn("Could not read inputDetails from model:", e);
        }
      }

      async function scanCameras(activeDeviceId = "") {
        try {
          statusEl.innerText = "Scanning for cameras...";
          const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          tempStream.getTracks().forEach((t) => t.stop());

          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter((d) => d.kind === "videoinput");

          if (videoDevices.length === 0) {
            cameraSelect.innerHTML = '<option value="">No cameras found</option>';
            statusEl.innerText = "Camera scan complete: No devices found.";
            return;
          }

          const currentVal = activeDeviceId || cameraSelect.value;
          cameraSelect.innerHTML = "";
          videoDevices.forEach((device, idx) => {
            const opt = document.createElement("option");
            opt.value = device.deviceId;
            opt.text = device.label || `Camera ${idx + 1}`;
            if (device.deviceId === currentVal || (!currentVal && idx === 0)) {
              opt.selected = true;
            }
            cameraSelect.appendChild(opt);
          });
          statusEl.innerText = `Camera scan complete: Found ${videoDevices.length} camera(s).`;
        } catch (err) {
          statusEl.innerText = `Camera scan failed: ${err.message}`;
          console.warn("Could not scan cameras:", err);
        }
      }

      scanBtn.addEventListener("click", () => scanCameras());

      async function updateCameraList(activeDeviceId = "") {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter((d) => d.kind === "videoinput");
          if (videoDevices.length === 0) return;

          cameraSelect.innerHTML = "";
          videoDevices.forEach((device, idx) => {
            const opt = document.createElement("option");
            opt.value = device.deviceId;
            opt.text = device.label || `Camera ${idx + 1}`;
            if (device.deviceId === activeDeviceId || (!activeDeviceId && idx === 0)) {
              opt.selected = true;
            }
            cameraSelect.appendChild(opt);
          });
        } catch (err) {
          console.warn("Could not enumerate cameras:", err);
        }
      }

      async function checkWebGpuSupport() {
        if (!("gpu" in navigator)) return false;
        try {
          const adapter = await navigator.gpu.requestAdapter();
          return !!adapter;
        } catch {
          return false;
        }
      }

      async function initRuntime() {
        try {
          statusEl.innerText = "Loading LiteRT Wasm runtime...";
          await loadLiteRt("https://cdn.jsdelivr.net/npm/@litertjs/core/wasm/");
          runtimeReady = true;
          statusEl.innerText = "Runtime initialized. Please select a .tflite model file to load.";
        } catch (err) {
          statusEl.innerText = `Failed to load LiteRT runtime: ${err.message}`;
          console.error(err);
        }
      }

      async function compileModel(modelUint8Array, requestedAccelerator = "auto") {
        if (model && typeof model.delete === "function") {
          model.delete();
          model = null;
        }

        const hasGpu = await checkWebGpuSupport();
        let compiled = null;

        if (requestedAccelerator === "webgpu") {
          if (!hasGpu) throw new Error("WebGPU is not supported or enabled in this browser window.");
          statusEl.innerText = "Compiling on WebGPU...";
          compiled = await loadAndCompile(modelUint8Array, { accelerator: "webgpu" });
          backendBadge.innerText = "WebGPU";
        } else if (requestedAccelerator === "wasm") {
          statusEl.innerText = "Compiling on CPU (WASM / XNNPACK)...";
          compiled = await loadAndCompile(modelUint8Array, { accelerator: "wasm" });
          backendBadge.innerText = "WASM (CPU)";
        } else {
          if (hasGpu) {
            try {
              statusEl.innerText = "Attempting compilation on WebGPU...";
              compiled = await loadAndCompile(modelUint8Array, { accelerator: "webgpu" });
              backendBadge.innerText = "WebGPU";
            } catch (gpuErr) {
              console.warn("WebGPU compilation failed, falling back to WASM:", gpuErr);
            }
          }
          if (!compiled) {
            statusEl.innerText = "Falling back to CPU (WASM / XNNPACK)...";
            compiled = await loadAndCompile(modelUint8Array, { accelerator: "wasm" });
            backendBadge.innerText = "WASM (CPU Fallback)";
          }
        }

        syncDimensionsFromModel(compiled);
        return compiled;
      }

      modelFileInput.addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (!runtimeReady) {
          statusEl.innerText = "LiteRT runtime is still initializing, please wait...";
          return;
        }

        try {
          statusEl.innerText = `Reading model file: ${file.name}...`;
          const arrayBuffer = await file.arrayBuffer();
          cachedModelBuffer = new Uint8Array(arrayBuffer);

          model = await compileModel(cachedModelBuffer, acceleratorSelect.value);

          statusEl.innerText = `Model "${file.name}" loaded (${backendBadge.innerText}) at ${imgWidthInput.value}x${imgHeightInput.value}. Click "Start Camera".`;
          startBtn.disabled = false;
        } catch (err) {
          statusEl.innerText = `Failed to compile model: ${err.message}`;
          backendBadge.innerText = "Error";
          startBtn.disabled = true;
          console.error(err);
        }
      });

      acceleratorSelect.addEventListener("change", async () => {
        if (!cachedModelBuffer) return;
        try {
          const wasRunning = isRunning;
          isRunning = false;
          model = await compileModel(cachedModelBuffer, acceleratorSelect.value);
          statusEl.innerText = `Model recompiled with ${backendBadge.innerText}.`;
          if (wasRunning) {
            isRunning = true;
            requestAnimationFrame(renderLoop);
          }
        } catch (err) {
          statusEl.innerText = `Failed to switch accelerator: ${err.message}`;
          backendBadge.innerText = "Error";
          console.error(err);
        }
      });

      // Preprocessing: Planar NCHW [1, 3, H, W] normalized float32
      function preprocessFrame() {
        const { width: inputWidth, height: inputHeight } = getInputDimensions();

        if (processCanvas.width !== inputWidth || processCanvas.height !== inputHeight) {
          processCanvas.width = inputWidth;
          processCanvas.height = inputHeight;
        }

        processCtx.drawImage(video, 0, 0, inputWidth, inputHeight);
        const imgData = processCtx.getImageData(0, 0, inputWidth, inputHeight).data;

        const numPixels = inputWidth * inputHeight;
        const chwFloatArray = new Float32Array(numPixels * 3);

        for (let i = 0; i < numPixels; i++) {
          chwFloatArray[i] = imgData[i * 4] / 255.0; // R
          chwFloatArray[numPixels + i] = imgData[i * 4 + 1] / 255.0; // G
          chwFloatArray[numPixels * 2 + i] = imgData[i * 4 + 2] / 255.0; // B
        }

        return new Tensor(chwFloatArray, [1, 3, inputHeight, inputWidth]);
      }

      function iou(boxA, boxB) {
        const x1 = Math.max(boxA.x1, boxB.x1);
        const y1 = Math.max(boxA.y1, boxB.y1);
        const x2 = Math.min(boxA.x2, boxB.x2);
        const y2 = Math.min(boxA.y2, boxB.y2);

        const interWidth = Math.max(0, x2 - x1);
        const interHeight = Math.max(0, y2 - y1);
        const interArea = interWidth * interHeight;

        const areaA = (boxA.x2 - boxA.x1) * (boxA.y2 - boxA.y1);
        const areaB = (boxB.x2 - boxB.x1) * (boxB.y2 - boxB.y1);

        return interArea / (areaA + areaB - interArea + 1e-6);
      }

      function nms(boxes, iouThreshold) {
        boxes.sort((a, b) => b.score - a.score);
        const selected = [];

        for (const box of boxes) {
          let keep = true;
          for (const chosen of selected) {
            if (box.cls === chosen.cls && iou(box, chosen) > iouThreshold) {
              keep = false;
              break;
            }
          }
          if (keep) {
            selected.push(box);
          }
        }
        return selected;
      }

      function postprocessYOLO(data, shape, width, height) {
        const confThreshold = parseFloat(confThreshInput.value) || 0.25;
        const iouThreshold = parseFloat(iouThreshInput.value) || 0.45;

        let numAttrs, numCandidates, isTransposed;

        if (shape.length === 3) {
          if (shape[1] < shape[2]) {
            numAttrs = shape[1]; // e.g. 84 or 116
            numCandidates = shape[2]; // e.g. 4725 or 8400
            isTransposed = true;
          } else {
            numCandidates = shape[1];
            numAttrs = shape[2];
            isTransposed = false;
          }
        } else if (shape.length === 2) {
          numAttrs = shape[0] < shape[1] ? shape[0] : shape[1];
          numCandidates = shape[0] < shape[1] ? shape[1] : shape[0];
          isTransposed = shape[0] < shape[1];
        } else {
          return [];
        }

        const numClasses = Math.min(80, numAttrs - 4);
        const candidates = [];

        for (let i = 0; i < numCandidates; i++) {
          let cx, cy, w, h;
          if (isTransposed) {
            cx = data[0 * numCandidates + i];
            cy = data[1 * numCandidates + i];
            w = data[2 * numCandidates + i];
            h = data[3 * numCandidates + i];
          } else {
            cx = data[i * numAttrs + 0];
            cy = data[i * numAttrs + 1];
            w = data[i * numAttrs + 2];
            h = data[i * numAttrs + 3];
          }

          let maxScore = -Infinity;
          let maxCls = -1;

          for (let c = 0; c < numClasses; c++) {
            const score = isTransposed ? data[(4 + c) * numCandidates + i] : data[i * numAttrs + (4 + c)];

            if (score > maxScore) {
              maxScore = score;
              maxCls = c;
            }
          }

          if (maxScore >= confThreshold) {
            const x1 = Math.max(0, cx - w / 2);
            const y1 = Math.max(0, cy - h / 2);
            const x2 = Math.min(width, cx + w / 2);
            const y2 = Math.min(height, cy + h / 2);

            candidates.push({
              x1,
              y1,
              x2,
              y2,
              score: maxScore,
              cls: maxCls,
              label: COCO_CLASSES[maxCls] || `cls_${maxCls}`,
            });
          }
        }

        return nms(candidates, iouThreshold);
      }

      function drawDetections(detections) {
        ctx.lineWidth = 2;
        ctx.font = "13px monospace";

        detections.forEach((det) => {
          const color = COLORS[det.cls % COLORS.length];
          const boxWidth = det.x2 - det.x1;
          const boxHeight = det.y2 - det.y1;

          ctx.strokeStyle = color;
          ctx.strokeRect(det.x1, det.y1, boxWidth, boxHeight);

          const labelText = `${det.label} ${(det.score * 100).toFixed(0)}%`;
          const textWidth = ctx.measureText(labelText).width;
          const textHeight = 16;
          const labelY = Math.max(textHeight, det.y1);

          ctx.fillStyle = color;
          ctx.fillRect(det.x1, labelY - textHeight, textWidth + 6, textHeight);

          ctx.fillStyle = "#000000";
          ctx.fillText(labelText, det.x1 + 3, labelY - 3);
        });
      }

      async function renderLoop() {
        if (!isRunning) return;

        if (video.readyState >= 2 && model) {
          const { width, height } = getInputDimensions();
          ctx.drawImage(video, 0, 0, width, height);

          const inputTensor = preprocessFrame();

          try {
            const outputs = await model.run(inputTensor);

            if (outputs && outputs.length > 0) {
              const outTensor = outputs[0];
              const outData = await outTensor.data();
              const shape = outTensor.shape || [1, 84, 8400];

              const detections = postprocessYOLO(outData, shape, width, height);
              detCountEl.innerText = detections.length;

              drawDetections(detections);

              for (let i = 0; i < outputs.length; i++) {
                outputs[i].delete();
              }
            }
          } catch (inferenceErr) {
            console.error("Inference error:", inferenceErr);
          } finally {
            inputTensor.delete();
          }

          frameCount++;
          const now = performance.now();
          if (now - fpsTimer >= 1000) {
            fpsEl.innerText = ((frameCount * 1000) / (now - fpsTimer)).toFixed(1);
            frameCount = 0;
            fpsTimer = now;
          }
        }

        requestAnimationFrame(renderLoop);
      }

      startBtn.addEventListener("click", async () => {
        statusEl.innerText = "Requesting camera permissions...";
        const { width: inputWidth, height: inputHeight } = getInputDimensions();
        updateCanvasDimensions();

        const selectedDeviceId = cameraSelect.value;
        const constraints = {
          video: {
            deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
            width: { ideal: inputWidth },
            height: { ideal: inputHeight },
          },
          audio: false,
        };

        try {
          if (stream) {
            stream.getTracks().forEach((t) => t.stop());
          }

          stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          await video.play();

          const videoTrack = stream.getVideoTracks()[0];
          const activeDeviceId = videoTrack?.getSettings()?.deviceId || selectedDeviceId;
          await updateCameraList(activeDeviceId);

          isRunning = true;
          startBtn.disabled = true;
          stopBtn.disabled = false;
          statusEl.innerText = "Inference active.";
          requestAnimationFrame(renderLoop);
        } catch (err) {
          statusEl.innerText = `Camera access error: ${err.message}`;
          console.error(err);
        }
      });

      cameraSelect.addEventListener("change", async () => {
        if (isRunning) {
          startBtn.click();
        }
      });

      stopBtn.addEventListener("click", () => {
        isRunning = false;
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
        detCountEl.innerText = "0";
        statusEl.innerText = "Camera stopped.";
      });

      initRuntime();
    </script>
  </body>
</html>

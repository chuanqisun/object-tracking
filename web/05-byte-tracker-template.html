<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Classical Puck Tracker — BYTE-JS</title>
  </head>
  <body>
    <h3>Classical Puck Tracker (from-scratch BYTE, no DL)</h3>

    <div>
      <button id="btnCam">Start Webcam</button>
      <input type="file" id="fileIn" accept="video/*" />
      <button id="btnPause">Pause</button>
      <button id="btnStep">Step</button>
      <button id="btnBg">Capture Background</button>
      <button id="btnClearBg">Clear Background</button>
    </div>

    <p>Template acquisition: <b>click &amp; drag on the video</b> to define a circular sample (center = press point, radius = drag distance).</p>

    <div>
      <canvas id="view" width="640" height="480"></canvas>
      <canvas id="debug" width="320" height="240"></canvas>
    </div>

    <div>
      <label><input type="checkbox" id="cbMask" checked /> show mask</label>
      <label><input type="checkbox" id="cbDets" checked /> show detections</label>
      <label><input type="checkbox" id="cbPred" checked /> show predictions</label>
    </div>

    <fieldset>
      <legend>Config</legend>
      <div id="cfgPanel"></div>
    </fieldset>

    <fieldset>
      <legend>Templates (identities)</legend>
      <div id="tplList"></div>
    </fieldset>

    <fieldset>
      <legend>Diagnostics</legend>
      <pre id="diag"></pre>
    </fieldset>

    <video id="vid" playsinline muted style="display: none"></video>

    <script>
      "use strict";

      /* ============================================================
       * CONFIG — every value live-tunable from the UI
       * ============================================================ */
      const CONFIG = {
        procWidth: { v: 320, min: 160, max: 640, step: 20, label: "processing width (px)" },
        maskChromaTh: { v: 0.06, min: 0.01, max: 0.2, step: 0.005, label: "mask: chroma distance threshold" },
        bgChromaTh: { v: 0.035, min: 0.005, max: 0.15, step: 0.005, label: "bg-gate: chroma diff threshold" },
        sigmaColor: { v: 0.045, min: 0.005, max: 0.2, step: 0.005, label: "score: color sigma" },
        tauHigh: { v: 0.55, min: 0.1, max: 0.95, step: 0.05, label: "BYTE: tau high" },
        tauLow: { v: 0.15, min: 0.0, max: 0.6, step: 0.05, label: "BYTE: tau low (discard below)" },
        minAreaFrac: { v: 0.15, min: 0.02, max: 1.0, step: 0.01, label: "blob: min area (× expected)" },
        maxAreaFrac: { v: 4.0, min: 1.0, max: 10.0, step: 0.5, label: "blob: max area (× expected)" },
        gateHighMul: { v: 4.0, min: 1.0, max: 12.0, step: 0.5, label: "assoc1 gate (× radius)" },
        gateLowMul: { v: 6.0, min: 1.0, max: 16.0, step: 0.5, label: "assoc2 gate (× radius)" },
        colorGate: { v: 0.1, min: 0.01, max: 0.3, step: 0.01, label: "assoc1 color gate" },
        reidGate: { v: 0.055, min: 0.005, max: 0.2, step: 0.005, label: "re-ID chroma gate" },
        wColor: { v: 0.6, min: 0.0, max: 1.0, step: 0.05, label: "score weight: color" },
        maxMisses: { v: 15, min: 1, max: 90, step: 1, label: "frames to coast before LOST" },
        kfProcNoise: { v: 1.0, min: 0.01, max: 10.0, step: 0.01, label: "KF process noise" },
        kfMeasNoise: { v: 2.0, min: 0.1, max: 20.0, step: 0.1, label: "KF measurement noise" },
      };
      const C = (k) => CONFIG[k].v;

      /* ============================================================
       * SMALL LINEAR ALGEBRA + KALMAN FILTER (constant velocity, 2D)
       * state = [x, y, vx, vy]
       * ============================================================ */
      class Kalman2D {
        constructor(x, y) {
          this.reset(x, y);
        }
        reset(x, y) {
          this.x = new Float64Array([x, y, 0, 0]);
          // P: diag, generous initial velocity uncertainty
          this.P = new Float64Array(16);
          this.P[0] = 10;
          this.P[5] = 10;
          this.P[10] = 100;
          this.P[15] = 100;
        }
        predict(dt = 1) {
          const X = this.x,
            P = this.P,
            q = C("kfProcNoise");
          X[0] += X[2] * dt;
          X[1] += X[3] * dt;
          // P = F P F^T + Q  (F = [[1,0,dt,0],[0,1,0,dt],[0,0,1,0],[0,0,0,1]])
          const Pn = new Float64Array(16);
          // F P
          for (let r = 0; r < 4; r++)
            for (let c = 0; c < 4; c++) {
              let s = P[r * 4 + c];
              if (r === 0) s += dt * P[2 * 4 + c];
              if (r === 1) s += dt * P[3 * 4 + c];
              Pn[r * 4 + c] = s;
            }
          // (F P) F^T
          const Po = new Float64Array(16);
          for (let r = 0; r < 4; r++)
            for (let c = 0; c < 4; c++) {
              let s = Pn[r * 4 + c];
              if (c === 0) s += dt * Pn[r * 4 + 2];
              if (c === 1) s += dt * Pn[r * 4 + 3];
              Po[r * 4 + c] = s;
            }
          // Q (white-accel model, simplified diagonal)
          const dt2 = dt * dt;
          Po[0] += 0.25 * dt2 * dt2 * q;
          Po[5] += 0.25 * dt2 * dt2 * q;
          Po[10] += dt2 * q;
          Po[15] += dt2 * q;
          this.P = Po;
        }
        update(zx, zy) {
          const X = this.x,
            P = this.P,
            r = C("kfMeasNoise");
          // S = HPH' + R  (2x2, top-left of P)
          const s00 = P[0] + r,
            s01 = P[1],
            s10 = P[4],
            s11 = P[5] + r;
          const det = s00 * s11 - s01 * s10;
          if (Math.abs(det) < 1e-12) return;
          const i00 = s11 / det,
            i01 = -s01 / det,
            i10 = -s10 / det,
            i11 = s00 / det;
          // K = P H' S^-1  → 4x2 (P columns 0,1 times S^-1)
          const K = new Float64Array(8);
          for (let row = 0; row < 4; row++) {
            const p0 = P[row * 4],
              p1 = P[row * 4 + 1];
            K[row * 2] = p0 * i00 + p1 * i10;
            K[row * 2 + 1] = p0 * i01 + p1 * i11;
          }
          const y0 = zx - X[0],
            y1 = zy - X[1];
          for (let row = 0; row < 4; row++) X[row] += K[row * 2] * y0 + K[row * 2 + 1] * y1;
          // P = P - K * (top two rows of P)
          const R0 = P.slice(0, 4),
            R1 = P.slice(4, 8);
          for (let row = 0; row < 4; row++) for (let col = 0; col < 4; col++) P[row * 4 + col] -= K[row * 2] * R0[col] + K[row * 2 + 1] * R1[col];
        }
        get pos() {
          return [this.x[0], this.x[1]];
        }
        get vel() {
          return [this.x[2], this.x[3]];
        }
      }

      /* ============================================================
       * HUNGARIAN (Munkres) — O(n^3), potentials formulation.
       * cost: n×m regular array. Returns assign[row] = col | -1.
       * Pairs whose cost >= BIG are treated as forbidden.
       * ============================================================ */
      const BIG = 1e6;
      function hungarian(costIn) {
        const n = costIn.length;
        if (n === 0) return [];
        let m = costIn[0].length;
        if (m === 0) return new Array(n).fill(-1);
        // pad columns so m >= n
        const mm = Math.max(m, n);
        const cost = costIn.map((row) => {
          const r = row.slice();
          while (r.length < mm) r.push(BIG * 2);
          return r;
        });
        const INF = 1e18;
        const u = new Float64Array(n + 1),
          v = new Float64Array(mm + 1);
        const p = new Int32Array(mm + 1),
          way = new Int32Array(mm + 1);
        for (let i = 1; i <= n; i++) {
          p[0] = i;
          let j0 = 0;
          const minv = new Float64Array(mm + 1).fill(INF);
          const used = new Uint8Array(mm + 1);
          do {
            used[j0] = 1;
            const i0 = p[j0];
            let delta = INF,
              j1 = -1;
            for (let j = 1; j <= mm; j++)
              if (!used[j]) {
                const cur = cost[i0 - 1][j - 1] - u[i0] - v[j];
                if (cur < minv[j]) {
                  minv[j] = cur;
                  way[j] = j0;
                }
                if (minv[j] < delta) {
                  delta = minv[j];
                  j1 = j;
                }
              }
            for (let j = 0; j <= mm; j++) {
              if (used[j]) {
                u[p[j]] += delta;
                v[j] -= delta;
              } else minv[j] -= delta;
            }
            j0 = j1;
          } while (p[j0] !== 0);
          do {
            const j1 = way[j0];
            p[j0] = p[j1];
            j0 = j1;
          } while (j0);
        }
        const assign = new Array(n).fill(-1);
        for (let j = 1; j <= mm; j++) if (p[j] > 0 && j <= m && cost[p[j] - 1][j - 1] < BIG) assign[p[j] - 1] = j - 1;
        return assign;
      }

      /* ============================================================
       * TEMPLATE STORE — one template == one identity
       * chroma prior in normalized (r,g); radius in proc pixels
       * ============================================================ */
      let tplSeq = 0;
      class TemplateStore {
        constructor() {
          this.templates = [];
          this.onChange = null;
        }
        add(tpl) {
          tpl.id = tplSeq++;
          this.templates.push(tpl);
          this.onChange && this.onChange();
        }
        remove(id) {
          this.templates = this.templates.filter((t) => t.id !== id);
          this.onChange && this.onChange();
        }
      }

      /* ============================================================
       * PREPROCESSOR — RGBA → normalized chromaticity (r,g) + intensity
       * ============================================================ */
      class Preprocessor {
        alloc(w, h) {
          this.w = w;
          this.h = h;
          const n = w * h;
          this.r = new Float32Array(n);
          this.g = new Float32Array(n);
          this.I = new Float32Array(n);
        }
        run(imageData) {
          const d = imageData.data,
            r = this.r,
            g = this.g,
            I = this.I,
            n = this.w * this.h;
          for (let i = 0, p = 0; i < n; i++, p += 4) {
            const R = d[p],
              G = d[p + 1],
              B = d[p + 2];
            const s = R + G + B + 1e-3;
            r[i] = R / s;
            g[i] = G / s;
            I[i] = s / 3;
          }
        }
      }

      /* ============================================================
       * DETECTOR — likelihood mask → connected components → scoring
       * Detection: {x, y, area, bbox, r, g, score, colorScore, geomScore, tplBest}
       * ============================================================ */
      class Detector {
        alloc(w, h) {
          this.w = w;
          this.h = h;
          const n = w * h;
          this.mask = new Uint8Array(n);
          this.labels = new Int32Array(n);
          this.stack = new Int32Array(n);
          this.bg = null; // {r,g} snapshots
        }
        captureBackground(pre) {
          this.bg = { r: pre.r.slice(), g: pre.g.slice() };
        }
        clearBackground() {
          this.bg = null;
        }

        run(pre, templates) {
          const dets = [];
          if (templates.length === 0) {
            this.mask.fill(0);
            return dets;
          }
          const { w, h } = this,
            n = w * h;
          const mask = this.mask,
            R = pre.r,
            G = pre.g;
          const mTh = C("maskChromaTh"),
            bgTh = C("bgChromaTh"),
            bg = this.bg;
          const T = templates;

          // --- mask: template chroma proximity AND (optional) chroma bg gate ---
          for (let i = 0; i < n; i++) {
            let dmin = 1e9;
            const ri = R[i],
              gi = G[i];
            for (let t = 0; t < T.length; t++) {
              const dr = ri - T[t].cr,
                dg = gi - T[t].cg;
              const d = dr * dr + dg * dg;
              if (d < dmin) dmin = d;
            }
            let ok = dmin < mTh * mTh;
            if (ok && bg) {
              const dr = ri - bg.r[i],
                dg = gi - bg.g[i];
              ok = dr * dr + dg * dg > bgTh * bgTh; // chroma-only → shadows are ignored
            }
            mask[i] = ok ? 1 : 0;
          }

          // --- area gates from templates ---
          let minExp = 1e9,
            maxExp = 0;
          for (const t of T) {
            const a = Math.PI * t.radius * t.radius;
            minExp = Math.min(minExp, a);
            maxExp = Math.max(maxExp, a);
          }
          const minArea = Math.max(4, minExp * C("minAreaFrac"));
          const maxArea = maxExp * C("maxAreaFrac");

          // --- connected components (flood fill) ---
          const labels = this.labels;
          labels.fill(-1);
          const stack = this.stack;
          let nextLabel = 0;
          for (let i = 0; i < n; i++) {
            if (!mask[i] || labels[i] !== -1) continue;
            let sp = 0;
            stack[sp++] = i;
            labels[i] = nextLabel;
            let area = 0,
              sx = 0,
              sy = 0,
              sr = 0,
              sg = 0;
            let minx = w,
              maxx = 0,
              miny = h,
              maxy = 0;
            while (sp > 0) {
              const q = stack[--sp];
              const qx = q % w,
                qy = (q / w) | 0;
              area++;
              sx += qx;
              sy += qy;
              sr += R[q];
              sg += G[q];
              if (qx < minx) minx = qx;
              if (qx > maxx) maxx = qx;
              if (qy < miny) miny = qy;
              if (qy > maxy) maxy = qy;
              // 4-neighborhood
              if (qx > 0 && mask[q - 1] && labels[q - 1] === -1) {
                labels[q - 1] = nextLabel;
                stack[sp++] = q - 1;
              }
              if (qx < w - 1 && mask[q + 1] && labels[q + 1] === -1) {
                labels[q + 1] = nextLabel;
                stack[sp++] = q + 1;
              }
              if (qy > 0 && mask[q - w] && labels[q - w] === -1) {
                labels[q - w] = nextLabel;
                stack[sp++] = q - w;
              }
              if (qy < h - 1 && mask[q + w] && labels[q + w] === -1) {
                labels[q + w] = nextLabel;
                stack[sp++] = q + w;
              }
            }
            nextLabel++;
            if (area < minArea || area > maxArea) continue;

            const mr = sr / area,
              mg = sg / area;
            // best template by chroma
            let tplBest = null,
              dBest = 1e9;
            for (const t of T) {
              const dr = mr - t.cr,
                dg = mg - t.cg;
              const d = Math.sqrt(dr * dr + dg * dg);
              if (d < dBest) {
                dBest = d;
                tplBest = t;
              }
            }
            const colorScore = Math.exp(-dBest / C("sigmaColor"));
            // geometry: area ratio + bbox squareness + fill ratio vs. disc
            const expA = Math.PI * tplBest.radius * tplBest.radius;
            const areaScore = Math.max(0, 1 - Math.abs(area - expA) / expA);
            const bw = maxx - minx + 1,
              bh = maxy - miny + 1;
            const aspect = Math.min(bw, bh) / Math.max(bw, bh);
            const fill = area / (bw * bh);
            const fillScore = Math.max(0, 1 - Math.abs(fill - Math.PI / 4) / (Math.PI / 4));
            const geomScore = 0.5 * areaScore + 0.25 * aspect + 0.25 * fillScore;
            const wc = C("wColor");
            dets.push({
              x: sx / area,
              y: sy / area,
              area,
              bbox: [minx, miny, bw, bh],
              r: mr,
              g: mg,
              tplBest,
              colorScore,
              geomScore,
              score: wc * colorScore + (1 - wc) * geomScore,
            });
          }
          return dets;
        }
      }

      /* ============================================================
       * BYTE TRACKER — from scratch, fixed identity slots
       *   Stage 1: ACTIVE × D_high   (motion + color)
       *   Stage 2: remaining ACTIVE × D_low  (motion only)   ← BYTE core
       *   Stage 3: LOST/NEW × remaining D_high (color-only re-ID)
       * ============================================================ */
      const TS = { NEW: "NEW", ACTIVE: "ACTIVE", LOST: "LOST" };
      class Track {
        constructor(tpl) {
          this.tpl = tpl;
          this.state = TS.NEW;
          this.kf = null;
          this.miss = 0;
          this.hits = 0;
          this.age = 0;
          this.lastDet = null;
          this.lastStage = "-";
        }
      }
      class ByteTracker {
        constructor(store) {
          this.store = store;
          this.tracks = [];
        }
        sync() {
          // one track per template, keep existing
          const byTpl = new Map(this.tracks.map((t) => [t.tpl.id, t]));
          this.tracks = this.store.templates.map((tpl) => byTpl.get(tpl.id) || new Track(tpl));
        }
        update(detHigh, detLow) {
          this.sync();
          const stats = { m1: 0, m2: 0, m3: 0 };
          for (const t of this.tracks) {
            t.age++;
            t.lastStage = "-";
            if (t.state === TS.ACTIVE) t.kf.predict(1);
          }

          const active = this.tracks.filter((t) => t.state === TS.ACTIVE);
          const usedHigh = new Set(),
            usedLow = new Set();

          // ---- Stage 1: ACTIVE × D_high (spatial + color) ----
          if (active.length && detHigh.length) {
            const cost = active.map((t) =>
              detHigh.map((d) => {
                const [px, py] = t.kf.pos;
                const gate = t.tpl.radius * C("gateHighMul");
                const dist = Math.hypot(d.x - px, d.y - py);
                const cd = Math.hypot(d.r - t.tpl.cr, d.g - t.tpl.cg);
                if (dist > gate || cd > C("colorGate")) return BIG;
                return 0.5 * (dist / gate) + 0.5 * (cd / C("colorGate"));
              }),
            );
            const asg = hungarian(cost);
            asg.forEach((j, i) => {
              if (j >= 0) {
                this._hit(active[i], detHigh[j], "S1");
                usedHigh.add(j);
                stats.m1++;
              }
            });
          }

          // ---- Stage 2: remaining ACTIVE × D_low (spatial only — BYTE) ----
          const rem = active.filter((t) => t.lastStage === "-");
          if (rem.length && detLow.length) {
            const cost = rem.map((t) =>
              detLow.map((d) => {
                const [px, py] = t.kf.pos;
                const gate = t.tpl.radius * C("gateLowMul");
                const dist = Math.hypot(d.x - px, d.y - py);
                return dist > gate ? BIG : dist / gate;
              }),
            );
            const asg = hungarian(cost);
            asg.forEach((j, i) => {
              if (j >= 0) {
                this._hit(rem[i], detLow[j], "S2");
                usedLow.add(j);
                stats.m2++;
              }
            });
          }

          // ---- Stage 3: LOST/NEW × remaining D_high (color-only re-ID) ----
          const lost = this.tracks.filter((t) => t.state !== TS.ACTIVE);
          const freeHigh = detHigh.map((d, j) => (usedHigh.has(j) ? null : { d, j })).filter(Boolean);
          if (lost.length && freeHigh.length) {
            const cost = lost.map((t) =>
              freeHigh.map(({ d }) => {
                const cd = Math.hypot(d.r - t.tpl.cr, d.g - t.tpl.cg);
                return cd > C("reidGate") ? BIG : cd / C("reidGate");
              }),
            );
            const asg = hungarian(cost);
            asg.forEach((k, i) => {
              if (k >= 0) {
                const { d, j } = freeHigh[k];
                const t = lost[i];
                t.kf = new Kalman2D(d.x, d.y);
                t.state = TS.ACTIVE;
                t.miss = 0;
                this._hit(t, d, "S3");
                usedHigh.add(j);
                stats.m3++;
              }
            });
          }

          // ---- bookkeeping: coast / lose ----
          for (const t of this.tracks) {
            if (t.state === TS.ACTIVE && t.lastStage === "-") {
              t.miss++;
              if (t.miss > C("maxMisses")) t.state = TS.LOST; // freeze; awaits Stage 3
            }
          }
          return stats;
        }
        _hit(t, d, stage) {
          if (!t.kf) t.kf = new Kalman2D(d.x, d.y);
          t.kf.update(d.x, d.y);
          t.miss = 0;
          t.hits++;
          t.lastDet = d;
          t.lastStage = stage;
          if (t.state !== TS.ACTIVE) t.state = TS.ACTIVE;
        }
      }

      /* ============================================================
       * DIAGNOSTICS — EMA stage timers + counters
       * ============================================================ */
      class Diag {
        constructor() {
          this.t = {};
          this.fpsT = performance.now();
          this.fps = 0;
          this.frames = 0;
        }
        mark(name, ms) {
          this.t[name] = (this.t[name] ?? ms) * 0.9 + ms * 0.1;
        }
        tickFPS() {
          this.frames++;
          const now = performance.now();
          if (now - this.fpsT > 500) {
            this.fps = (this.frames * 1000) / (now - this.fpsT);
            this.frames = 0;
            this.fpsT = now;
          }
        }
      }

      /* ============================================================
       * APP — orchestration, UI, rendering, template acquisition
       * ============================================================ */
      const vid = document.getElementById("vid");
      const view = document.getElementById("view"),
        vctx = view.getContext("2d");
      const dbg = document.getElementById("debug"),
        dctx = dbg.getContext("2d");
      const diagEl = document.getElementById("diag");

      const proc = document.createElement("canvas");
      const pctx = proc.getContext("2d", { willReadFrequently: true });

      const store = new TemplateStore();
      const pre = new Preprocessor();
      const detector = new Detector();
      const tracker = new ByteTracker(store);
      const diag = new Diag();

      let playing = true,
        stepOnce = false,
        lastImageData = null;
      let procW = 0,
        procH = 0;

      function ensureBuffers() {
        const targetW = Math.round(C("procWidth"));
        if (!vid.videoWidth) return false;
        if (procW !== targetW) {
          procW = targetW;
          procH = Math.round((targetW * vid.videoHeight) / vid.videoWidth);
          proc.width = procW;
          proc.height = procH;
          pre.alloc(procW, procH);
          detector.alloc(procW, procH);
          dbg.width = procW;
          dbg.height = procH;
        }
        return true;
      }

      /* ---------- main loop ---------- */
      let lastStats = { m1: 0, m2: 0, m3: 0 },
        lastDets = { high: [], low: [], all: [] };
      function loop() {
        requestAnimationFrame(loop);
        if (vid.readyState < 2 || !ensureBuffers()) return;
        if (!playing && !stepOnce) {
          render();
          return;
        }
        stepOnce = false;

        let t0 = performance.now();
        pctx.drawImage(vid, 0, 0, procW, procH);
        lastImageData = pctx.getImageData(0, 0, procW, procH);
        diag.mark("capture", performance.now() - t0);

        t0 = performance.now();
        pre.run(lastImageData);
        diag.mark("preprocess", performance.now() - t0);

        t0 = performance.now();
        const dets = detector.run(pre, store.templates);
        const high = [],
          low = [];
        for (const d of dets) {
          if (d.score >= C("tauHigh")) high.push(d);
          else if (d.score >= C("tauLow")) low.push(d);
        }
        lastDets = { high, low, all: dets };
        diag.mark("detect", performance.now() - t0);

        t0 = performance.now();
        lastStats = tracker.update(high, low);
        diag.mark("associate", performance.now() - t0);

        t0 = performance.now();
        render();
        diag.mark("render", performance.now() - t0);
        diag.tickFPS();
        renderDiag();
      }

      /* ---------- rendering ---------- */
      function render() {
        if (vid.videoWidth) {
          view.width = Math.min(640, vid.videoWidth);
          view.height = Math.round((view.width * vid.videoHeight) / vid.videoWidth);
        }
        vctx.drawImage(vid, 0, 0, view.width, view.height);
        const sx = view.width / (procW || 1),
          sy = view.height / (procH || 1);

        // detections
        if (document.getElementById("cbDets").checked) {
          for (const d of lastDets.all) {
            const hi = d.score >= C("tauHigh");
            vctx.strokeStyle = hi ? "lime" : "orange";
            vctx.setLineDash(hi ? [] : [4, 3]);
            vctx.strokeRect(d.bbox[0] * sx, d.bbox[1] * sy, d.bbox[2] * sx, d.bbox[3] * sy);
            vctx.setLineDash([]);
            vctx.fillStyle = hi ? "lime" : "orange";
            vctx.font = "10px monospace";
            vctx.fillText(d.score.toFixed(2), d.bbox[0] * sx, d.bbox[1] * sy - 2);
          }
        }
        // tracks
        for (const t of tracker.tracks) {
          if (!t.kf) continue;
          const [px, py] = t.kf.pos;
          const rr = t.tpl.radius * sx;
          vctx.lineWidth = 2;
          vctx.strokeStyle = t.state === TS.ACTIVE ? t.tpl.css : "gray";
          vctx.beginPath();
          vctx.arc(px * sx, py * sy, rr, 0, Math.PI * 2);
          vctx.stroke();
          vctx.fillStyle = vctx.strokeStyle;
          vctx.font = "12px monospace";
          vctx.fillText(`#${t.tpl.id} ${t.state}${t.miss ? " miss:" + t.miss : ""} ${t.lastStage}`, px * sx + rr + 2, py * sy);
          if (document.getElementById("cbPred").checked && t.state === TS.ACTIVE) {
            const [vx, vyv] = t.kf.vel;
            vctx.beginPath();
            vctx.moveTo(px * sx, py * sy);
            vctx.lineTo((px + vx * 5) * sx, (py + vyv * 5) * sy);
            vctx.stroke();
          }
          vctx.lineWidth = 1;
        }
        // drag preview
        if (drag) {
          vctx.strokeStyle = "cyan";
          vctx.beginPath();
          vctx.arc(drag.x0, drag.y0, Math.hypot(drag.x1 - drag.x0, drag.y1 - drag.y0), 0, Math.PI * 2);
          vctx.stroke();
        }
        // debug mask view
        if (document.getElementById("cbMask").checked && procW) {
          const img = dctx.createImageData(procW, procH);
          const m = detector.mask;
          for (let i = 0; i < m.length; i++) {
            const v = m[i] ? 255 : 0,
              p = i * 4;
            img.data[p] = v;
            img.data[p + 1] = v;
            img.data[p + 2] = v;
            img.data[p + 3] = 255;
          }
          dctx.putImageData(img, 0, 0);
        } else dctx.clearRect(0, 0, dbg.width, dbg.height);
      }

      function renderDiag() {
        const t = diag.t;
        const lines = [];
        lines.push(`FPS(proc): ${diag.fps.toFixed(1)}   proc: ${procW}x${procH}   bg model: ${detector.bg ? "ON" : "off"}`);
        lines.push(
          `timings ms — capture:${(t.capture || 0).toFixed(1)} pre:${(t.preprocess || 0).toFixed(1)} detect:${(t.detect || 0).toFixed(1)} assoc:${(t.associate || 0).toFixed(2)} render:${(t.render || 0).toFixed(1)}`,
        );
        lines.push(`detections — high:${lastDets.high.length} low:${lastDets.low.length} total:${lastDets.all.length}`);
        lines.push(`matches — stage1:${lastStats.m1} stage2(BYTE low):${lastStats.m2} stage3(re-ID):${lastStats.m3}`);
        lines.push(`tracks:`);
        for (const tr of tracker.tracks) {
          const p = tr.kf ? tr.kf.pos.map((v) => v.toFixed(1)).join(",") : "-";
          lines.push(`  #${tr.tpl.id} ${tr.tpl.name.padEnd(10)} ${tr.state.padEnd(6)} pos(${p}) miss:${tr.miss} hits:${tr.hits} via:${tr.lastStage}`);
        }
        diagEl.textContent = lines.join("\n");
      }

      /* ---------- template acquisition (click + drag circle) ---------- */
      let drag = null;
      view.addEventListener("mousedown", (e) => {
        drag = { x0: e.offsetX, y0: e.offsetY, x1: e.offsetX, y1: e.offsetY };
      });
      view.addEventListener("mousemove", (e) => {
        if (drag) {
          drag.x1 = e.offsetX;
          drag.y1 = e.offsetY;
          if (!playing) render();
        }
      });
      window.addEventListener("mouseup", (e) => {
        if (!drag || !lastImageData) {
          drag = null;
          return;
        }
        const radDisp = Math.hypot(drag.x1 - drag.x0, drag.y1 - drag.y0);
        if (radDisp >= 3) {
          const s = procW / view.width;
          const cx = drag.x0 * s,
            cy = drag.y0 * s,
            rad = Math.max(2, radDisp * s);
          // sample mean chroma inside circle from last processed frame
          let sr = 0,
            sg = 0,
            sR = 0,
            sG = 0,
            sB = 0,
            cnt = 0;
          const d = lastImageData.data;
          for (let y = Math.max(0, (cy - rad) | 0); y <= Math.min(procH - 1, (cy + rad) | 0); y++)
            for (let x = Math.max(0, (cx - rad) | 0); x <= Math.min(procW - 1, (cx + rad) | 0); x++) {
              if ((x - cx) ** 2 + (y - cy) ** 2 > rad * rad) continue;
              const i = y * procW + x,
                p = i * 4;
              sr += pre.r[i];
              sg += pre.g[i];
              sR += d[p];
              sG += d[p + 1];
              sB += d[p + 2];
              cnt++;
            }
          if (cnt > 0) {
            store.add({
              name: `puck-${tplSeq}`,
              cr: sr / cnt,
              cg: sg / cnt,
              radius: rad,
              css: `rgb(${(sR / cnt) | 0},${(sG / cnt) | 0},${(sB / cnt) | 0})`,
            });
          }
        }
        drag = null;
      });

      /* ---------- template list UI ---------- */
      store.onChange = () => {
        const el = document.getElementById("tplList");
        el.innerHTML = "";
        for (const t of store.templates) {
          const row = document.createElement("div");
          const sw = document.createElement("span");
          sw.textContent = "\u25A0 ";
          sw.style.color = t.css;
          row.appendChild(sw);
          row.appendChild(document.createTextNode(`#${t.id} ${t.name} — chroma(r=${t.cr.toFixed(3)}, g=${t.cg.toFixed(3)}) radius=${t.radius.toFixed(1)}px `));
          const btn = document.createElement("button");
          btn.textContent = "delete";
          btn.onclick = () => store.remove(t.id);
          row.appendChild(btn);
          el.appendChild(row);
        }
      };

      /* ---------- config panel ---------- */
      (function buildCfg() {
        const panel = document.getElementById("cfgPanel");
        for (const key of Object.keys(CONFIG)) {
          const c = CONFIG[key];
          const row = document.createElement("div");
          const lab = document.createElement("label");
          const val = document.createElement("span");
          const inp = document.createElement("input");
          inp.type = "range";
          inp.min = c.min;
          inp.max = c.max;
          inp.step = c.step;
          inp.value = c.v;
          val.textContent = " " + c.v;
          inp.oninput = () => {
            c.v = parseFloat(inp.value);
            val.textContent = " " + c.v;
          };
          lab.textContent = c.label + ": ";
          row.appendChild(lab);
          row.appendChild(inp);
          row.appendChild(val);
          panel.appendChild(row);
        }
      })();

      /* ---------- source & transport controls ---------- */
      document.getElementById("btnCam").onclick = async () => {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
          vid.srcObject = s;
          await vid.play();
        } catch (err) {
          alert("webcam error: " + err.message);
        }
      };
      document.getElementById("fileIn").onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        vid.srcObject = null;
        vid.src = URL.createObjectURL(f);
        vid.loop = true;
        vid.play();
      };
      document.getElementById("btnPause").onclick = function () {
        playing = !playing;
        this.textContent = playing ? "Pause" : "Resume";
      };
      document.getElementById("btnStep").onclick = () => {
        stepOnce = true;
      };
      document.getElementById("btnBg").onclick = () => {
        if (lastImageData) detector.captureBackground(pre);
      };
      document.getElementById("btnClearBg").onclick = () => detector.clearBackground();

      requestAnimationFrame(loop);
    </script>
  </body>
</html>

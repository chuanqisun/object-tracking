<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YOLO Segmentation WebGPU / WASM Inference</title>
  </head>
  <body>
    <h2>YOLO Segmentation Web Inference (WebGPU / WASM)</h2>

    <div>
      <label>1. Select Exported ONNX Model: </label>
      <input type="file" id="modelFile" accept=".onnx" />
    </div>
    <br />

    <div>
      <label>2. Select Test Image: </label>
      <input type="file" id="imageFile" accept="image/*" disabled />
    </div>
    <br />

    <div>
      <label>Confidence Threshold: </label>
      <input type="range" id="confThres" min="0.1" max="0.9" step="0.05" value="0.35" />
      <span id="confVal">0.35</span>
      &nbsp;&nbsp;
      <label>IoU Threshold (NMS): </label>
      <input type="range" id="iouThres" min="0.1" max="0.9" step="0.05" value="0.45" />
      <span id="iouVal">0.45</span>
    </div>
    <br />

    <div>
      <button id="runBtn" disabled>Run Inference</button>
    </div>
    <br />

    <div id="status">Please load your ONNX model to begin.</div>
    <br />

    <!-- Output rendering canvas -->
    <canvas id="outputCanvas" width="640" height="640" style="border: 1px solid black; max-width: 100%"></canvas>

    <script type="module">
      import * as ort from "https://esm.sh/onnxruntime-web";

      // Enable multi-threading & SIMD
      ort.env.wasm.numThreads = navigator.hardwareConcurrency || 4;
      ort.env.wasm.simd = true;

      let session = null;
      let loadedImage = null;

      const modelFileInput = document.getElementById("modelFile");
      const imageFileInput = document.getElementById("imageFile");
      const runBtn = document.getElementById("runBtn");
      const statusDiv = document.getElementById("status");
      const confThresInput = document.getElementById("confThres");
      const iouThresInput = document.getElementById("iouThres");
      const confValLabel = document.getElementById("confVal");
      const iouValLabel = document.getElementById("iouVal");
      const canvas = document.getElementById("outputCanvas");
      const ctx = canvas.getContext("2d");

      confThresInput.addEventListener("input", (e) => (confValLabel.innerText = e.target.value));
      iouThresInput.addEventListener("input", (e) => (iouValLabel.innerText = e.target.value));

      // 1. Load ONNX model with WebGPU priority and WASM fallback
      modelFileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusDiv.innerText = "Loading ONNX model... (Compiling WebGPU shaders / WASM kernels)";
        const arrayBuffer = await file.arrayBuffer();

        try {
          session = await ort.InferenceSession.create(arrayBuffer, {
            executionProviders: ["webgpu", "wasm"],
            graphOptimizationLevel: "all",
          });
          statusDiv.innerText = `Model loaded successfully! Engine: WebGPU/WASM | Inputs: [${session.inputNames}]`;
        } catch (err) {
          console.warn("WebGPU initialization failed, falling back to WASM SIMD/threads:", err);
          session = await ort.InferenceSession.create(arrayBuffer, {
            executionProviders: ["wasm"],
          });
          statusDiv.innerText = `Model loaded successfully! Engine: WASM (SIMD/Multi-threaded) | Inputs: [${session.inputNames}]`;
        }

        imageFileInput.disabled = false;
      });

      // 2. Load Input Image
      imageFileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          loadedImage = img;
          runBtn.disabled = false;
          ctx.clearRect(0, 0, 640, 640);
          ctx.drawImage(loadedImage, 0, 0, 640, 640);
          statusDiv.innerText = "Image ready. Click 'Run Inference'.";
        };
      });

      // 3. Preprocess Image (NCHW 1x3x640x640)
      function preprocess(image) {
        const offscreen = document.createElement("canvas");
        offscreen.width = 640;
        offscreen.height = 640;
        const oCtx = offscreen.getContext("2d");
        oCtx.drawImage(image, 0, 0, 640, 640);

        const imgData = oCtx.getImageData(0, 0, 640, 640).data;
        const float32 = new Float32Array(3 * 640 * 640);

        for (let i = 0; i < 640 * 640; i++) {
          float32[i] = imgData[i * 4] / 255.0; // R
          float32[640 * 640 + i] = imgData[i * 4 + 1] / 255.0; // G
          float32[2 * 640 * 640 + i] = imgData[i * 4 + 2] / 255.0; // B
        }

        return new ort.Tensor("float32", float32, [1, 3, 640, 640]);
      }

      // Intersection over Union (IoU) calculation for NMS
      function computeIoU(boxA, boxB) {
        const xA = Math.max(boxA[0], boxB[0]);
        const yA = Math.max(boxA[1], boxB[1]);
        const xB = Math.min(boxA[2], boxB[2]);
        const yB = Math.min(boxA[3], boxB[3]);

        const interArea = Math.max(0, xB - xA) * Math.max(0, yB - yA);
        const boxAArea = (boxA[2] - boxA[0]) * (boxA[3] - boxA[1]);
        const boxBArea = (boxB[2] - boxB[0]) * (boxB[3] - boxB[1]);

        return interArea / (boxAArea + boxBArea - interArea + 1e-6);
      }

      // Non-Maximum Suppression (NMS)
      function nms(boxes, iouThreshold) {
        boxes.sort((a, b) => b.score - a.score);
        const selected = [];

        for (let i = 0; i < boxes.length; i++) {
          let keep = true;
          for (let j = 0; j < selected.length; j++) {
            if (boxes[i].classId === selected[j].classId && computeIoU(boxes[i].box, selected[j].box) > iouThreshold) {
              keep = false;
              break;
            }
          }
          if (keep) selected.push(boxes[i]);
        }
        return selected;
      }

      const sigmoid = (x) => 1 / (1 + Math.exp(-x));

      // Generate colors for mask rendering
      function getClassColor(id) {
        const colors = [
          [255, 56, 56],
          [255, 157, 151],
          [255, 112, 31],
          [255, 178, 29],
          [207, 210, 49],
          [72, 249, 10],
          [146, 204, 23],
          [61, 219, 134],
          [26, 147, 65],
          [35, 196, 196],
          [47, 160, 255],
          [0, 83, 235],
        ];
        return colors[id % colors.length];
      }

      // 4. Inference & Post-processing
      runBtn.addEventListener("click", async () => {
        if (!session || !loadedImage) return;

        statusDiv.innerText = "Running inference...";
        const startTime = performance.now();

        const tensor = preprocess(loadedImage);
        const feeds = {};
        feeds[session.inputNames[0]] = tensor;

        const results = await session.run(feeds);
        const totalTime = (performance.now() - startTime).toFixed(1);

        // Extract output tensors
        // output0: [1, 4 + num_classes + 32, num_anchors]
        // output1 (Proto masks): [1, 32, 160, 160]
        const output0 = results[session.outputNames[0]];
        const protoOutput = results[session.outputNames[1]];

        const [batch, channels, numBoxes] = output0.dims;
        const numMaskCoeffs = 32;
        const numClasses = channels - 4 - numMaskCoeffs;
        const outData = output0.data;
        const protoData = protoOutput.data;

        const confThres = parseFloat(confThresInput.value);
        const iouThres = parseFloat(iouThresInput.value);

        const rawDetections = [];

        // Filter boxes by confidence
        for (let i = 0; i < numBoxes; i++) {
          let maxScore = 0;
          let classId = -1;

          for (let c = 0; c < numClasses; c++) {
            const score = outData[(4 + c) * numBoxes + i];
            if (score > maxScore) {
              maxScore = score;
              classId = c;
            }
          }

          if (maxScore > confThres) {
            const cx = outData[0 * numBoxes + i];
            const cy = outData[1 * numBoxes + i];
            const w = outData[2 * numBoxes + i];
            const h = outData[3 * numBoxes + i];

            const maskCoeffs = new Float32Array(numMaskCoeffs);
            for (let m = 0; m < numMaskCoeffs; m++) {
              maskCoeffs[m] = outData[(4 + numClasses + m) * numBoxes + i];
            }

            rawDetections.push({
              box: [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2],
              score: maxScore,
              classId: classId,
              maskCoeffs: maskCoeffs,
            });
          }
        }

        // Apply NMS
        const detections = nms(rawDetections, iouThres);

        // Render base image
        ctx.clearRect(0, 0, 640, 640);
        ctx.drawImage(loadedImage, 0, 0, 640, 640);

        // Render Segmentation Masks
        const maskCanvas = document.createElement("canvas");
        maskCanvas.width = 160;
        maskCanvas.height = 160;
        const maskCtx = maskCanvas.getContext("2d");

        for (const det of detections) {
          const [x1, y1, x2, y2] = det.box;
          const color = getClassColor(det.classId);
          const maskImgData = maskCtx.createImageData(160, 160);

          // Convert box from 640x640 space to 160x160 mask space
          const mx1 = Math.max(0, Math.floor(x1 / 4));
          const my1 = Math.max(0, Math.floor(y1 / 4));
          const mx2 = Math.min(160, Math.ceil(x2 / 4));
          const my2 = Math.min(160, Math.ceil(y2 / 4));

          for (let y = my1; y < my2; y++) {
            for (let x = mx1; x < mx2; x++) {
              let sum = 0;
              for (let m = 0; m < numMaskCoeffs; m++) {
                sum += det.maskCoeffs[m] * protoData[m * 160 * 160 + y * 160 + x];
              }

              if (sigmoid(sum) > 0.5) {
                const idx = (y * 160 + x) * 4;
                maskImgData.data[idx] = color[0];
                maskImgData.data[idx + 1] = color[1];
                maskImgData.data[idx + 2] = color[2];
                maskImgData.data[idx + 3] = 120; // Alpha
              }
            }
          }

          maskCtx.putImageData(maskImgData, 0, 0);
          ctx.drawImage(maskCanvas, 0, 0, 640, 640);

          // Draw Bounding Box & Label
          ctx.strokeStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
          ctx.lineWidth = 2;
          ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

          ctx.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
          ctx.fillRect(x1, Math.max(0, y1 - 16), 110, 16);
          ctx.fillStyle = "white";
          ctx.font = "12px sans-serif";
          ctx.fillText(`Class ${det.classId}: ${(det.score * 100).toFixed(1)}%`, x1 + 2, Math.max(12, y1 - 3));
        }

        statusDiv.innerText = `Inference completed in ${totalTime} ms. Detected ${detections.length} objects.`;
      });
    </script>
  </body>
</html>

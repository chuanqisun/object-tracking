<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOLO Seg (WASM Multi-Thread Auto-Sniff)</title>
    <!-- Latest ONNX Runtime Web library -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.all.min.js"></script>
    <style>
      body {
        font-family: monospace;
        margin: 16px;
        background: #fff;
        color: #000;
      }
      .row {
        margin-bottom: 8px;
      }
      label {
        display: inline-block;
        min-width: 140px;
      }
      input,
      select,
      button {
        font-family: monospace;
        font-size: 13px;
      }
      #outputCanvas {
        border: 1px solid #000;
        display: block;
        max-width: 100%;
        height: auto;
      }
      #status {
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h3>YOLO SEGMENTATION (WASM MULTI-THREAD AUTO-SNIFF)</h3>

    <div class="row">
      <label>1. Model (.onnx):</label>
      <input type="file" id="modelFile" accept=".onnx" />
    </div>

    <div class="row">
      <label>2. Threads:</label>
      <input type="number" id="threadCount" min="1" max="32" value="4" style="width: 50px" />
    </div>

    <div class="row">
      <label>3. Camera:</label>
      <select id="cameraSelect" disabled>
        <option value="">-- Choose Camera --</option>
      </select>
      <button id="toggleStreamBtn" disabled>Start Camera</button>
    </div>

    <div class="row">
      <label>Conf Threshold:</label>
      <input type="range" id="confThres" min="0.1" max="0.9" step="0.05" value="0.35" />
      <span id="confVal">0.35</span>
    </div>

    <div class="row">
      <label>IoU Threshold:</label>
      <input type="range" id="iouThres" min="0.1" max="0.9" step="0.05" value="0.45" />
      <span id="iouVal">0.45</span>
    </div>

    <div id="status">[INIT] Checking Cross-Origin Isolation...</div>

    <video id="webcamVideo" playsinline muted style="display: none"></video>

    <div>
      <canvas id="outputCanvas" width="640" height="640"></canvas>
    </div>

    <script>
      // Multi-threaded WASM runtime configuration
      ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";
      ort.env.wasm.simd = true;

      const defaultThreads = Math.min(navigator.hardwareConcurrency || 4, 8);
      const threadInput = document.getElementById("threadCount");
      threadInput.value = defaultThreads;

      let session = null;
      let isStreaming = false;
      let isProcessing = false;
      let currentStream = null;
      let animFrameId = null;

      // Model metadata discovered via sniffing
      let modelConfig = {
        width: 640,
        height: 640,
        dtype: "float32", // "float32" or "uint8"
        rawType: 1, // 1=FLOAT, 2=UINT8
      };

      const modelFileInput = document.getElementById("modelFile");
      const cameraSelect = document.getElementById("cameraSelect");
      const toggleStreamBtn = document.getElementById("toggleStreamBtn");
      const video = document.getElementById("webcamVideo");
      const canvas = document.getElementById("outputCanvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: false });
      const statusDiv = document.getElementById("status");
      const confThresInput = document.getElementById("confThres");
      const iouThresInput = document.getElementById("iouThres");
      const confValLabel = document.getElementById("confVal");
      const iouValLabel = document.getElementById("iouVal");

      // Dynamic buffers reallocated during model sniff
      let offscreenCanvas = document.createElement("canvas");
      let offscreenCtx = offscreenCanvas.getContext("2d", { willReadFrequently: true });
      let maskCanvas = document.createElement("canvas");
      let maskCtx = maskCanvas.getContext("2d");
      let inputBuffer = null;

      confThresInput.addEventListener("input", (e) => (confValLabel.innerText = e.target.value));
      iouThresInput.addEventListener("input", (e) => (iouValLabel.innerText = e.target.value));

      const isIsolated = self.crossOriginIsolated;
      statusDiv.innerText = `[STATUS] Isolation: ${isIsolated ? "ACTIVE (Multi-thread enabled)" : "DISABLED (Single-thread fallback)"}. Load model to start.`;

      // Lightweight Binary Protobuf Sniffer for ONNX Input Shape & Quantization Type
      function sniffOnnxMetadata(buffer) {
        const bytes = new Uint8Array(buffer);
        let pos = 0;

        function readVarint() {
          let res = 0,
            shift = 0,
            b;
          do {
            if (pos >= bytes.length) return null;
            b = bytes[pos++];
            res |= (b & 0x7f) << shift;
            shift += 7;
          } while (b >= 0x80);
          return res >>> 0;
        }

        function skip(len) {
          pos = Math.min(bytes.length, pos + len);
        }

        try {
          // ModelProto -> GraphProto (field 7, wire type 2)
          while (pos < bytes.length) {
            const key = readVarint();
            if (key === null) break;
            const fieldNum = key >> 3;
            const wireType = key & 7;

            if (fieldNum === 7 && wireType === 2) {
              const graphLen = readVarint();
              const graphEnd = pos + graphLen;

              // GraphProto -> input ValueInfoProto (field 11, wire type 2)
              while (pos < graphEnd) {
                const gKey = readVarint();
                if (gKey === null) break;
                const gFieldNum = gKey >> 3;
                const gWireType = gKey & 7;

                if (gFieldNum === 11 && gWireType === 2) {
                  const valInfoLen = readVarint();
                  const valInfoEnd = pos + valInfoLen;

                  let elemType = 1; // 1: FLOAT, 2: UINT8
                  let dims = [];

                  // ValueInfoProto -> TypeProto type (field 2, wire type 2)
                  while (pos < valInfoEnd) {
                    const vKey = readVarint();
                    if (vKey === null) break;
                    const vFieldNum = vKey >> 3;
                    const vWireType = vKey & 7;

                    if (vFieldNum === 2 && vWireType === 2) {
                      const typeLen = readVarint();
                      const typeEnd = pos + typeLen;

                      // TypeProto -> Tensor (field 1, wire type 2)
                      while (pos < typeEnd) {
                        const tKey = readVarint();
                        if (tKey === null) break;
                        const tFieldNum = tKey >> 3;
                        const tWireType = tKey & 7;

                        if (tFieldNum === 1 && tWireType === 2) {
                          const tensorLen = readVarint();
                          const tensorEnd = pos + tensorLen;

                          while (pos < tensorEnd) {
                            const elemKey = readVarint();
                            if (elemKey === null) break;
                            const elemField = elemKey >> 3;
                            const elemWire = elemKey & 7;

                            if (elemField === 1 && elemWire === 0) {
                              // elem_type
                              elemType = readVarint();
                            } else if (elemField === 2 && elemWire === 2) {
                              // shape
                              const shapeLen = readVarint();
                              const shapeEnd = pos + shapeLen;
                              while (pos < shapeEnd) {
                                const dimKey = readVarint();
                                if (dimKey === null) break;
                                const dimField = dimKey >> 3;
                                const dimWire = dimKey & 7;
                                if (dimField === 1 && dimWire === 2) {
                                  // Dimension
                                  const dLen = readVarint();
                                  const dEnd = pos + dLen;
                                  let dVal = null;
                                  while (pos < dEnd) {
                                    const dk = readVarint();
                                    if (dk === null) break;
                                    if (dk >> 3 === 1 && (dk & 7) === 0) {
                                      // dim_value
                                      dVal = readVarint();
                                    } else {
                                      if ((dk & 7) === 0) readVarint();
                                      else if ((dk & 7) === 2) skip(readVarint());
                                      else if ((dk & 7) === 5) skip(4);
                                      else if ((dk & 7) === 1) skip(8);
                                    }
                                  }
                                  if (dVal !== null) dims.push(dVal);
                                } else {
                                  if (dimWire === 0) readVarint();
                                  else if (dimWire === 2) skip(readVarint());
                                  else if (dimWire === 5) skip(4);
                                  else if (dimWire === 1) skip(8);
                                }
                              }
                            } else {
                              if (elemWire === 0) readVarint();
                              else if (elemWire === 2) skip(readVarint());
                              else if (elemWire === 5) skip(4);
                              else if (elemWire === 1) skip(8);
                            }
                          }
                        } else {
                          if (tWireType === 0) readVarint();
                          else if (tWireType === 2) skip(readVarint());
                          else if (tWireType === 5) skip(4);
                          else if (tWireType === 1) skip(8);
                        }
                      }
                    } else {
                      if (vWireType === 0) readVarint();
                      else if (vWireType === 2) skip(readVarint());
                      else if (vWireType === 5) skip(4);
                      else if (vWireType === 1) skip(8);
                    }
                  }

                  if (dims.length >= 2) {
                    const h = dims[dims.length - 2] || 640;
                    const w = dims[dims.length - 1] || 640;
                    return {
                      width: w,
                      height: h,
                      dtype: elemType === 2 ? "uint8" : "float32",
                      rawType: elemType,
                    };
                  }
                } else {
                  if (gWireType === 0) readVarint();
                  else if (gWireType === 2) skip(readVarint());
                  else if (gWireType === 5) skip(4);
                  else if (gWireType === 1) skip(8);
                }
              }
              break;
            } else {
              if (wireType === 0) readVarint();
              else if (wireType === 2) skip(readVarint());
              else if (wireType === 5) skip(4);
              else if (wireType === 1) skip(8);
            }
          }
        } catch (e) {
          console.warn("ONNX metadata sniffing error, using fallback defaults:", e);
        }
        return { width: 640, height: 640, dtype: "float32", rawType: 1 };
      }

      function setupModelBuffers(sniffed) {
        modelConfig = sniffed;

        canvas.width = modelConfig.width;
        canvas.height = modelConfig.height;

        offscreenCanvas.width = modelConfig.width;
        offscreenCanvas.height = modelConfig.height;

        // Proto mask size in YOLO seg is typically 1/4th of the input dimension
        const maskW = Math.floor(modelConfig.width / 4);
        const maskH = Math.floor(modelConfig.height / 4);
        maskCanvas.width = maskW;
        maskCanvas.height = maskH;

        const totalElements = 3 * modelConfig.width * modelConfig.height;
        if (modelConfig.dtype === "uint8") {
          inputBuffer = new Uint8Array(totalElements);
        } else {
          inputBuffer = new Float32Array(totalElements);
        }
      }

      async function populateCameraList() {
        cameraSelect.innerHTML = "";
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
          tempStream.getTracks().forEach((t) => t.stop());

          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter((d) => d.kind === "videoinput");

          videoDevices.forEach((device, index) => {
            const opt = document.createElement("option");
            opt.value = device.deviceId;
            opt.text = device.label || `Camera ${index + 1}`;
            cameraSelect.appendChild(opt);
          });

          if (videoDevices.length > 0) {
            cameraSelect.disabled = false;
            toggleStreamBtn.disabled = false;
          }
        } catch (err) {
          statusDiv.innerText = `[ERROR] Camera access: ${err.message}`;
        }
      }

      async function createWasmInferenceSession(modelBuffer, requestedThreads) {
        const threads = parseInt(requestedThreads, 10) || 4;
        ort.env.wasm.numThreads = threads;
        ort.env.wasm.simd = true;

        statusDiv.innerText = `[INFO] Initializing WASM session (${threads} threads)...`;

        const sessionOptions = {
          executionProviders: ["wasm"],
          graphOptimizationLevel: "all",
          intraOpNumThreads: threads,
        };

        const sess = await ort.InferenceSession.create(modelBuffer, sessionOptions);
        return { session: sess, threads: threads };
      }

      modelFileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusDiv.innerText = "[INFO] Sniffing model metadata & creating WASM session...";
        try {
          const buffer = await file.arrayBuffer();
          const sniffed = sniffOnnxMetadata(buffer);
          setupModelBuffers(sniffed);

          const res = await createWasmInferenceSession(buffer, threadInput.value);
          session = res.session;

          statusDiv.innerText = `[READY] Sniffed: ${modelConfig.width}x${modelConfig.height} | Type: ${modelConfig.dtype} | WASM: ${res.threads}T. Select camera.`;
          await populateCameraList();
        } catch (err) {
          console.error(err);
          statusDiv.innerText = `[ERROR] ${err.message}`;
        }
      });

      async function startStream(deviceId) {
        if (currentStream) {
          currentStream.getTracks().forEach((t) => t.stop());
        }

        const constraints = {
          video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: modelConfig.width },
            height: { ideal: modelConfig.height },
          },
          audio: false,
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();

        isStreaming = true;
        toggleStreamBtn.innerText = "Stop Camera";
        requestAnimationFrame(renderLoop);
      }

      function stopStream() {
        isStreaming = false;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        if (currentStream) {
          currentStream.getTracks().forEach((t) => t.stop());
          currentStream = null;
        }
        toggleStreamBtn.innerText = "Start Camera";
        statusDiv.innerText = "[INFO] Camera stopped.";
      }

      toggleStreamBtn.addEventListener("click", () => {
        if (isStreaming) stopStream();
        else startStream(cameraSelect.value);
      });

      cameraSelect.addEventListener("change", () => {
        if (isStreaming) startStream(cameraSelect.value);
      });

      function preprocess(videoElem) {
        const w = modelConfig.width;
        const h = modelConfig.height;
        offscreenCtx.drawImage(videoElem, 0, 0, w, h);
        const imgData = offscreenCtx.getImageData(0, 0, w, h).data;
        const total = w * h;
        const isUint8 = modelConfig.dtype === "uint8";

        for (let i = 0; i < total; i++) {
          const r = imgData[i * 4];
          const g = imgData[i * 4 + 1];
          const b = imgData[i * 4 + 2];

          if (isUint8) {
            inputBuffer[i] = r;
            inputBuffer[total + i] = g;
            inputBuffer[2 * total + i] = b;
          } else {
            inputBuffer[i] = r / 255.0;
            inputBuffer[total + i] = g / 255.0;
            inputBuffer[2 * total + i] = b / 255.0;
          }
        }

        return new ort.Tensor(modelConfig.dtype, inputBuffer, [1, 3, h, w]);
      }

      function computeIoU(boxA, boxB) {
        const xA = Math.max(boxA[0], boxB[0]);
        const yA = Math.max(boxA[1], boxB[1]);
        const xB = Math.min(boxA[2], boxB[2]);
        const yB = Math.min(boxA[3], boxB[3]);

        const interArea = Math.max(0, xB - xA) * Math.max(0, yB - yA);
        const boxAArea = (boxA[2] - boxA[0]) * (boxA[3] - boxA[1]);
        const boxBArea = (boxB[2] - boxB[0]) * (boxB[3] - boxB[1]);

        return interArea / (boxAArea + boxBArea - interArea + 1e-6);
      }

      function nms(boxes, iouThreshold) {
        boxes.sort((a, b) => b.score - a.score);
        const selected = [];
        for (let i = 0; i < boxes.length; i++) {
          let keep = true;
          for (let j = 0; j < selected.length; j++) {
            if (boxes[i].classId === selected[j].classId && computeIoU(boxes[i].box, selected[j].box) > iouThreshold) {
              keep = false;
              break;
            }
          }
          if (keep) selected.push(boxes[i]);
        }
        return selected;
      }

      const sigmoid = (x) => 1 / (1 + Math.exp(-x));

      function getClassColor(id) {
        const colors = [
          [255, 56, 56],
          [255, 157, 151],
          [255, 112, 31],
          [255, 178, 29],
          [207, 210, 49],
          [72, 249, 10],
          [146, 204, 23],
          [61, 219, 134],
          [26, 147, 65],
          [35, 196, 196],
          [47, 160, 255],
          [0, 83, 235],
        ];
        return colors[id % colors.length];
      }

      async function renderLoop() {
        if (!isStreaming) return;

        if (session && !isProcessing && video.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) {
          isProcessing = true;
          const startTime = performance.now();

          try {
            const tensor = preprocess(video);
            const feeds = {};
            feeds[session.inputNames[0]] = tensor;

            const results = await session.run(feeds);
            const duration = (performance.now() - startTime).toFixed(1);
            const fps = (1000 / duration).toFixed(0);

            const output0 = results[session.outputNames[0]];
            const protoOutput = results[session.outputNames[1]];

            const [batch, channels, numBoxes] = output0.dims;
            const numMaskCoeffs = 32;
            const numClasses = channels - 4 - numMaskCoeffs;
            const outData = output0.data;
            const protoData = protoOutput.data;

            const [, protoChannels, protoH, protoW] = protoOutput.dims;

            const confThres = parseFloat(confThresInput.value);
            const iouThres = parseFloat(iouThresInput.value);
            const rawDetections = [];

            for (let i = 0; i < numBoxes; i++) {
              let maxScore = 0;
              let classId = -1;

              for (let c = 0; c < numClasses; c++) {
                const score = outData[(4 + c) * numBoxes + i];
                if (score > maxScore) {
                  maxScore = score;
                  classId = c;
                }
              }

              if (maxScore > confThres) {
                const cx = outData[0 * numBoxes + i];
                const cy = outData[1 * numBoxes + i];
                const w = outData[2 * numBoxes + i];
                const h = outData[3 * numBoxes + i];

                const maskCoeffs = new Float32Array(numMaskCoeffs);
                for (let m = 0; m < numMaskCoeffs; m++) {
                  maskCoeffs[m] = outData[(4 + numClasses + m) * numBoxes + i];
                }

                rawDetections.push({
                  box: [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2],
                  score: maxScore,
                  classId: classId,
                  maskCoeffs: maskCoeffs,
                });
              }
            }

            const detections = nms(rawDetections, iouThres);

            ctx.drawImage(video, 0, 0, modelConfig.width, modelConfig.height);

            const scaleX = protoW / modelConfig.width;
            const scaleY = protoH / modelConfig.height;

            for (const det of detections) {
              const [x1, y1, x2, y2] = det.box;
              const color = getClassColor(det.classId);
              const maskImgData = maskCtx.createImageData(protoW, protoH);

              const mx1 = Math.max(0, Math.floor(x1 * scaleX));
              const my1 = Math.max(0, Math.floor(y1 * scaleY));
              const mx2 = Math.min(protoW, Math.ceil(x2 * scaleX));
              const my2 = Math.min(protoH, Math.ceil(y2 * scaleY));

              for (let y = my1; y < my2; y++) {
                for (let x = mx1; x < mx2; x++) {
                  let sum = 0;
                  for (let m = 0; m < numMaskCoeffs; m++) {
                    sum += det.maskCoeffs[m] * protoData[m * protoH * protoW + y * protoW + x];
                  }

                  if (sigmoid(sum) > 0.5) {
                    const idx = (y * protoW + x) * 4;
                    maskImgData.data[idx] = color[0];
                    maskImgData.data[idx + 1] = color[1];
                    maskImgData.data[idx + 2] = color[2];
                    maskImgData.data[idx + 3] = 125;
                  }
                }
              }

              maskCtx.putImageData(maskImgData, 0, 0);
              ctx.drawImage(maskCanvas, 0, 0, modelConfig.width, modelConfig.height);

              ctx.strokeStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
              ctx.lineWidth = 2;
              ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

              ctx.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
              ctx.fillRect(x1, Math.max(0, y1 - 16), 110, 16);
              ctx.fillStyle = "#fff";
              ctx.font = "11px monospace";
              ctx.fillText(`cls:${det.classId} ${(det.score * 100).toFixed(0)}%`, x1 + 2, Math.max(12, y1 - 3));
            }

            statusDiv.innerText = `[RUNNING] WASM: ${duration}ms (${fps} FPS) | In: ${modelConfig.width}x${modelConfig.height} (${modelConfig.dtype}) | Detections: ${detections.length}`;
          } catch (err) {
            console.error(err);
          } finally {
            isProcessing = false;
          }
        }

        animFrameId = requestAnimationFrame(renderLoop);
      }
    </script>
  </body>
</html>
